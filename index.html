<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f9e16"><title>Codes entrepôt</title><link rel="icon" href="LOGO%20code%20barre.png"><link rel="apple-touch-icon" href="LOGO%20code%20barre.png"><style>
:root{--p:#2f9e16;--bg:#f6f8f5;--txt:#111}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.main{max-width:760px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 12px 94px}.page{display:none}.page.on{display:block}.favgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px}.fav,.qr,.result{background:#fff;color:#111;font-weight:800}.fav{min-height:58px;border:2px solid #111;border-radius:2px;font-size:20px}.search{display:flex;gap:8px}.search input,.field{width:100%;border:2px solid #bfcbbb;border-radius:12px;padding:14px;font-size:18px;text-transform:uppercase}.go{border:0;border-radius:12px;background:var(--p);color:#fff;padding:0 18px;font-weight:800}.results{display:grid;gap:8px;margin-top:12px;max-height:66vh;overflow:auto}.result{border:0;border-radius:12px;padding:14px;text-align:left;font-size:17px;box-shadow:0 2px 8px #0001}.qrgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.qr{border:0;border-radius:14px;padding:12px;font-size:16px;box-shadow:0 2px 8px #0001}.qr img{display:block;width:100%;margin-top:8px;image-rendering:pixelated}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px}.row{display:flex;gap:8px}.list{margin-top:12px;max-height:50vh;overflow:auto}.item{display:flex;align-items:center;gap:10px;border-top:1px solid #ddd;padding:10px 2px}.item label{flex:1;font-weight:700}.del{border:0;border-radius:8px;padding:7px;color:#a00;background:#fee2e2}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #ccc;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:#fff;padding:10px 2px 8px;font-weight:700;color:#526050}.nav button.on{color:var(--p);background:#eaf7e5}.nav span{display:block;font-size:22px}.viewer{display:none;position:fixed;inset:0;z-index:20;background:#fff;align-items:center;justify-content:center;padding:16px;touch-action:pan-y}.viewer.on{display:flex}.inside{text-align:center;width:100%}.vtitle{font-size:clamp(32px,10vw,72px);font-weight:900;margin-bottom:18px}.bar svg{display:block;width:100%;max-height:55vh}.close{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));width:42px;height:42px;border:0;border-radius:50%;font-size:24px}.tip{color:#687568;margin-top:18px}.viewer.full .close,.viewer.full .tip{display:none}.viewer.full{padding:3px}.empty{text-align:center;color:#687568;padding:24px}@media(min-width:620px){.qrgrid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main class="main">
<section id="favorites" class="page on"><div id="favGrid" class="favgrid"></div></section>
<section id="generator" class="page"><div class="search"><input id="query" placeholder="Rechercher ou créer"><button class="go" id="make">Générer</button></div><div id="results" class="results"></div></section>
<section id="qrs" class="page"><div id="qrGrid" class="qrgrid"></div></section>
<section id="settings" class="page"><div class="card"><b>Ajouter une localisation</b><div class="row" style="margin-top:10px"><input id="newLoc" class="field"><button id="add" class="go">Ajouter</button></div></div><div class="card"><b>Localisations et favoris</b><p>Coche les emplacements à afficher sur l’accueil.</p><input id="filter" class="field" placeholder="Filtrer"><div id="locList" class="list"></div><button id="reset" class="del" style="margin-top:12px">Réinitialiser</button></div></section></main>
<nav class="nav"><button class="on" data-page="favorites"><span>★</span>Favoris</button><button data-page="generator"><span>⌕</span>Recherche</button><button data-page="qrs"><span>▦</span>QR codes</button><button data-page="settings"><span>⚙</span>Paramètres</button></nav>
<div id="viewer" class="viewer"><button class="close">×</button><div class="inside"><div id="vtitle" class="vtitle"></div><div id="bar" class="bar"></div><div class="tip">Appuie pour agrandir. Glisse à gauche ou à droite entre les QR codes.</div></div></div>
<script>
const DEF_FAV=['RC-0','F1','CONG 1','RC-1','F2','CONG 2','RC-2','F3','CONG 3','RB-0','F4','C3-A','RB-1','F5','VANCON','RB-2','AF4','AF5','G3','ART','DOCK-R'];
const QR=[['CARISTE 1','CARISTE1.png'],['CARISTE 2','CARISTE2.png'],['CARISTE 3','CARISTE3.png'],['CARISTE 4','CARISTE4.png'],['CARISTE 5','CARISTE5.png'],['PARTAGE 1','PARTAGE1.png'],['PARTAGE 2','PARATGE2.png'],['PARTAGE 3','PARTAGE3.png'],['PARTAGE 4','PARATGE4.png'],['PARTAGE 5','PARTAGE5.png']];
const p=n=>String(n).padStart(2,'0');function defaults(){let a=['A','AF4','AF5','ART','C3-A','CONG 1','CONG 2','CONG 3','RC-0','RC-1','RC-2','RB-0','RB-1','RB-2','G3'];for(let n=1;n<=55;n++)if(n!==38)a.push('D'+p(n));a.push('DOCK-D','DOCK-R','F1','F2','F3','F4','F5');for(let n=1;n<=12;n++)a.push('P'+p(n));a.push('PN');for(let r=1;r<=21;r+=2){if(r===9){for(const s of ['C','D'])for(let l=1;l<=3;l++)a.push('RA'+p(r)+s+l)}else for(const s of ['A','B','C','D'])for(let l=1;l<=2;l++)a.push('RA'+p(r)+s+l)}a.push('RB');for(let r=1;r<=22;r++){if(r===9||r===10){for(const s of ['C','D'])for(let l=1;l<=3;l++)a.push('RB'+p(r)+s+l)}else for(const s of ['A','B','C','D'])for(let l=1;l<=2;l++)a.push('RB'+p(r)+s+l)}a.push('RC');for(let r=2;r<=22;r++){if(r===9||r===10){for(const s of ['C','D'])for(let l=1;l<=3;l++)a.push('RC'+p(r)+s+l)}else for(const s of ['A','B','C','D'])for(let l=1;l<=2;l++)a.push('RC'+p(r)+s+l)}for(let r=4;r<=22;r+=2){if(r===10){for(const s of ['C','D'])for(let l=1;l<=3;l++)a.push('RD'+p(r)+s+l)}else if(r<=8){for(const s of ['A','B','C','D'])for(let l=1;l<=2;l++)a.push('RD'+p(r)+s+l)}else for(const s of ['A','B','C'])for(let l=1;l<=2;l++)a.push('RD'+p(r)+s+l)}a.push('SALLE-DE-TRIE');for(let n=1;n<=10;n++)a.push('VAN'+n);a.push('VANCON');return a}
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}let loc=load('warehouse_locations_v3',defaults()),fav=load('warehouse_favorites_v3',DEF_FAV).filter(x=>loc.includes(x));function save(){localStorage.setItem('warehouse_locations_v3',JSON.stringify(loc));localStorage.setItem('warehouse_favorites_v3',JSON.stringify(fav))}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const P=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function svg(t){t=t.toUpperCase();let v=[...t].map(c=>{let n=c.charCodeAt(0);return n<32||n>126?31:n-32}),sum=104;v.forEach((n,i)=>sum+=n*(i+1));let codes=[104,...v,sum%103,106],x=10,b='';for(const c of codes){for(let i=0;i<P[c].length;i++){let w=+P[c][i]*2;if(i%2===0)b+=`<rect x="${x}" width="${w}" height="120"/>`;x+=w}}return `<svg viewBox="0 0 ${x+10} 120"><rect width="100%" height="100%" fill="white"/>${b}</svg>`}
const V=document.getElementById('viewer');let currentQr=-1;function show(t){currentQr=-1;vtitle.textContent=t;bar.innerHTML=svg(t);V.classList.add('on');document.body.style.overflow='hidden'}function showQRAt(i){currentQr=(i+QR.length)%QR.length;const [n,s]=QR[currentQr];vtitle.textContent=n;bar.innerHTML=`<img src="${s}" alt="${n}" style="width:min(88vw,600px);max-height:68vh;object-fit:contain;image-rendering:pixelated">`;V.classList.add('on');document.body.style.overflow='hidden'}
function renderFav(){favGrid.innerHTML=fav.map(x=>`<button class="fav" data-x="${esc(x)}">${esc(x)}</button>`).join('');favGrid.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.x))}function search(){let q=query.value.trim().toUpperCase();results.innerHTML=q?loc.filter(x=>x.includes(q)).slice(0,50).map(x=>`<button class="result" data-x="${esc(x)}">${esc(x)}</button>`).join(''):'<div class="empty">Commence à écrire une localisation.</div>';results.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.x))}function renderQR(){qrGrid.innerHTML=QR.map((q,i)=>`<button class="qr" data-i="${i}">${q[0]}<img src="${q[1]}" alt="${q[0]}"></button>`).join('');qrGrid.querySelectorAll('button').forEach(b=>b.onclick=()=>showQRAt(+b.dataset.i))}function renderSet(){let q=filter.value.trim().toUpperCase();locList.innerHTML=loc.filter(x=>x.includes(q)).map(x=>`<div class="item"><input type="checkbox" data-f="${esc(x)}" ${fav.includes(x)?'checked':''}><label>${esc(x)}</label><button class="del" data-d="${esc(x)}">Supprimer</button></div>`).join('');document.querySelectorAll('[data-f]').forEach(c=>c.onchange=()=>{let x=c.dataset.f;c.checked&&!fav.includes(x)?fav.push(x):fav=fav.filter(v=>v!==x);save();renderFav()});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let x=b.dataset.d;if(confirm('Supprimer '+x+' ?')){loc=loc.filter(v=>v!==x);fav=fav.filter(v=>v!==x);save();renderSet();renderFav()}})}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.page).classList.add('on');if(b.dataset.page==='settings')renderSet()});query.oninput=search;make.onclick=()=>{let x=query.value.trim().toUpperCase();if(x)show(x)};filter.oninput=renderSet;add.onclick=()=>{let x=newLoc.value.trim().toUpperCase();if(x&&!loc.includes(x)){loc.push(x);loc.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));save();newLoc.value='';renderSet()}};reset.onclick=()=>{if(confirm('Réinitialiser la liste ?')){loc=defaults();fav=[...DEF_FAV];save();renderSet();renderFav()}};document.querySelector('.close').onclick=()=>{V.classList.remove('on','full');document.body.style.overflow=''};bar.onclick=e=>{e.stopPropagation();V.classList.toggle('full')};let tx=0,ty=0;V.addEventListener('touchstart',e=>{tx=e.changedTouches[0].screenX;ty=e.changedTouches[0].screenY},{passive:true});V.addEventListener('touchend',e=>{if(currentQr<0)return;let dx=e.changedTouches[0].screenX-tx,dy=e.changedTouches[0].screenY-ty;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))showQRAt(currentQr+(dx<0?1:-1))},{passive:true});V.onclick=e=>{if(e.target===V){V.classList.remove('on','full');document.body.style.overflow=''}};renderFav();search();renderQR();
</script></body></html>
