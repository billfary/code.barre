<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f9e16">
<title>Codes entrepôt</title>
<link rel="icon" href="LOGO%20code%20barre.png">
<link rel="apple-touch-icon" href="LOGO%20code%20barre.png">
<style>
:root{--green:#2f9e16;--bg:#f6f8f5;--nav:76px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111}button,input{font:inherit}.main{height:calc(100dvh - var(--nav) - env(safe-area-inset-bottom));max-width:760px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 12px 10px;overflow:hidden}.page{display:none;height:100%;overflow:hidden}.page.active{display:block}.fav-grid,.qr-grid{height:100%;display:grid;gap:12px 10px}.fav-grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(7,minmax(0,1fr))}.fav-button{border:2px solid var(--green);border-radius:14px;background:#fff;color:#111;font-size:20px;font-weight:800;box-shadow:0 3px 8px #2f9e1622}.qr-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(7,minmax(0,1fr))}.qr-button{border:3px solid #111;border-radius:10px;background:#fff;color:var(--green);font-size:18px;font-weight:900}.fav-button:active,.qr-button:active{transform:scale(.97)}.search-page{height:100%;position:relative;padding-bottom:72px}.results{height:100%;overflow:auto;display:grid;align-content:start;gap:8px}.result-button{border:0;border-radius:12px;background:#fff;padding:14px;text-align:left;font-weight:800;box-shadow:0 2px 8px #0001}.search-bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;background:var(--bg);padding-top:8px}.search-bar input,.field{width:100%;border:2px solid #bfcbbb;border-radius:12px;padding:14px;font-size:17px;text-transform:uppercase;background:#fff}.primary{border:0;border-radius:12px;background:var(--green);color:#fff;padding:0 15px;font-weight:800}.settings-scroll{height:100%;overflow:auto}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px}.row{display:flex;gap:8px;margin-top:10px}.location-row{display:flex;align-items:center;gap:10px;border-top:1px solid #ddd;padding:10px 2px}.location-row label{flex:1;font-weight:700}.danger{border:0;border-radius:8px;padding:7px;color:#a00;background:#fee2e2}.empty{text-align:center;color:#687568;padding:24px}.bottom-nav{position:fixed;z-index:20;bottom:0;left:0;right:0;height:calc(var(--nav) + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #ccc;padding-bottom:env(safe-area-inset-bottom)}.nav-button{border:0;background:#fff;color:#111;font-size:12px;font-weight:700;padding:7px 2px}.nav-button.active{color:var(--green);background:#eaf7e5}.nav-icon{display:block;width:25px;height:25px;margin:0 auto 4px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.viewer{display:none;position:fixed;inset:0;z-index:1000;background:#fff;align-items:center;justify-content:center;padding:16px;overflow:hidden;touch-action:none}.viewer.active{display:flex}.viewer-content{text-align:center;width:100%;pointer-events:none}.viewer-title{font-size:clamp(32px,10vw,72px);font-weight:900;margin-bottom:18px}.viewer-body svg{display:block;width:100%;max-height:58vh}.viewer-body img{width:min(88vw,600px);max-height:68vh;object-fit:contain;image-rendering:pixelated}.close-button{position:absolute;z-index:1002;right:18px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);width:62px;height:62px;border:0;border-radius:50%;background:#111;color:#fff;font-size:34px;font-weight:700;box-shadow:0 4px 14px #0004;touch-action:manipulation}.notice{font-size:22px;font-weight:800;padding:28px}@media(max-height:700px){.fav-grid,.qr-grid{gap:8px}.fav-button{font-size:18px}.qr-button{font-size:16px}}
</style>
</head>
<body>
<main id="appMain" class="main">
<section id="favoritesPage" class="page active"><div id="favoritesGrid" class="fav-grid"></div></section>
<section id="searchPage" class="page"><div class="search-page"><div id="searchResults" class="results"></div><div class="search-bar"><input id="searchInput" placeholder="Rechercher ou créer"><button id="generateButton" class="primary">Générer</button></div></div></section>
<section id="qrPage" class="page"><div id="qrGrid" class="qr-grid"></div></section>
<section id="settingsPage" class="page"><div class="settings-scroll"><div class="card"><b>Ajouter une localisation</b><div class="row"><input id="newLocationInput" class="field"><button id="addLocationButton" class="primary">Ajouter</button></div></div><div class="card"><b>Localisations et favoris</b><input id="settingsFilter" class="field" placeholder="Filtrer"><div id="locationList"></div><button id="resetButton" class="danger">Réinitialiser</button></div></div></section>
</main>
<nav class="bottom-nav">
<button class="nav-button active" data-page="0"><svg class="nav-icon" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9Z"/></svg>Favoris</button>
<button class="nav-button" data-page="1"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>Recherche</button>
<button class="nav-button" data-page="2"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM15 14h2v2h-2zM19 14h1v3h-3v3h-3v-2M19 19h1v1h-1z"/></svg>QR codes</button>
<button class="nav-button" data-page="3"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3 13 5.4 15.6 6 17.7 4.8 19.2 6.3 18 8.4 18.6 11 21 12 18.6 13 18 15.6 19.2 17.7 17.7 19.2 15.6 18 13 18.6 12 21 11 18.6 8.4 18 6.3 19.2 4.8 17.7 6 15.6 5.4 13 3 12 5.4 11 6 8.4 4.8 6.3 6.3 4.8 8.4 6 11 5.4Z"/><circle cx="12" cy="12" r="3"/></svg>Paramètres</button>
</nav>
<div id="viewer" class="viewer" aria-hidden="true"><button id="closeButton" class="close-button" aria-label="Fermer">×</button><div class="viewer-content"><div id="viewerTitle" class="viewer-title"></div><div id="viewerBody" class="viewer-body"></div></div></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const pages=[$('favoritesPage'),$('searchPage'),$('qrPage'),$('settingsPage')];
const navButtons=[...document.querySelectorAll('.nav-button')];
const favoritesGrid=$('favoritesGrid'),searchResults=$('searchResults'),searchInput=$('searchInput'),generateButton=$('generateButton'),qrGrid=$('qrGrid'),settingsFilter=$('settingsFilter'),locationList=$('locationList'),newLocationInput=$('newLocationInput'),addLocationButton=$('addLocationButton'),resetButton=$('resetButton'),viewer=$('viewer'),closeButton=$('closeButton'),viewerTitle=$('viewerTitle'),viewerBody=$('viewerBody'),appMain=$('appMain');
const DEFAULT_FAVORITES=['RC-0','F1','CONG 1','RC-1','F2','CONG 2','RC-2','F3','CONG 3','RB-0','F4','C3-A','RB-1','F5','VANCON','RB-2','AF4','AF5','G3','ART','DOCK-R'];
const qrItems=[];for(let i=1;i<=7;i++){qrItems.push({name:'CARISTE '+i,file:'CARISTE'+i+'.png',available:i<=5});qrItems.push({name:'PARTAGE '+i,file:(i===2||i===4?'PARATGE'+i:'PARTAGE'+i)+'.png',available:i<=5});}
const pad=n=>String(n).padStart(2,'0');
function defaultLocations(){const a=[...DEFAULT_FAVORITES,'A','AF4','AF5','ART','C3-A','CONG 1','CONG 2','CONG 3','DOCK-D','DOCK-R','PN','SALLE-DE-TRIE','VANCON'];for(let n=1;n<=55;n++)if(n!==38)a.push('D'+pad(n));for(let n=1;n<=12;n++)a.push('P'+pad(n));for(const z of ['RA','RB','RC'])for(let r=1;r<=22;r++)for(const c of ['A','B','C','D'])for(let l=1;l<=2;l++)a.push(z+pad(r)+c+l);for(let r=4;r<=22;r+=2)for(const c of ['A','B','C','D'])for(let l=1;l<=2;l++)a.push('RD'+pad(r)+c+l);for(let n=1;n<=10;n++)a.push('VAN'+n);return[...new Set(a)];}
function load(key,fallback){try{const v=JSON.parse(localStorage.getItem(key));return Array.isArray(v)?v:fallback}catch{return fallback}}
let locations=load('warehouse_locations_v52',defaultLocations());let favorites=load('warehouse_favorites_v52',DEFAULT_FAVORITES).filter(x=>locations.includes(x));let currentPage=0,currentQr=-1,closing=false,touchX=0,touchY=0;
function save(){localStorage.setItem('warehouse_locations_v52',JSON.stringify(locations));localStorage.setItem('warehouse_favorites_v52',JSON.stringify(favorites));}
const patterns=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function barcodeSvg(text){const values=[...text.toUpperCase()].map(c=>Math.max(0,Math.min(94,c.charCodeAt(0)-32)));let sum=104;values.forEach((n,i)=>sum+=n*(i+1));let x=10,bars='';for(const code of[104,...values,sum%103,106]){const p=patterns[code];for(let i=0;i<p.length;i++){const w=Number(p[i])*2;if(i%2===0)bars+=`<rect x="${x}" width="${w}" height="120"/>`;x+=w}}return`<svg viewBox="0 0 ${x+10} 120"><rect width="100%" height="100%" fill="white"/>${bars}</svg>`;}
function openBarcode(value){if(closing)return;currentQr=-1;viewerTitle.textContent=value;viewerBody.innerHTML=barcodeSvg(value);viewer.classList.add('active');viewer.setAttribute('aria-hidden','false');}
function openQr(index){if(closing)return;currentQr=(index+qrItems.length)%qrItems.length;const q=qrItems[currentQr];viewerTitle.textContent=q.name;viewerBody.innerHTML=q.available?`<img src="${q.file}" alt="${q.name}">`:'<div class="notice">Veuillez téléverser l’image dans GitHub.</div>';viewer.classList.add('active');viewer.setAttribute('aria-hidden','false');}
function closeViewer(event){if(event){event.preventDefault();event.stopPropagation();}if(closing)return;closing=true;viewer.classList.remove('active');viewer.setAttribute('aria-hidden','true');setTimeout(()=>{closing=false},450);}
function renderFavorites(){favoritesGrid.innerHTML='';favorites.forEach(value=>{const b=document.createElement('button');b.className='fav-button';b.textContent=value;b.addEventListener('click',()=>openBarcode(value));favoritesGrid.appendChild(b);});}
function renderQrButtons(){qrGrid.innerHTML='';for(let i=0;i<7;i++){for(const index of[i*2,i*2+1]){const b=document.createElement('button');b.className='qr-button';b.textContent=qrItems[index].name;b.addEventListener('click',()=>openQr(index));qrGrid.appendChild(b);}}}
function renderSearch(){const q=searchInput.value.trim().toUpperCase();searchResults.innerHTML='';if(!q){searchResults.innerHTML='<div class="empty">Commence à écrire une localisation.</div>';return;}locations.filter(x=>x.includes(q)).slice(0,60).forEach(value=>{const b=document.createElement('button');b.className='result-button';b.textContent=value;b.addEventListener('click',()=>openBarcode(value));searchResults.appendChild(b);});}
function renderSettings(){const q=settingsFilter.value.trim().toUpperCase();locationList.innerHTML='';locations.filter(x=>x.includes(q)).forEach(value=>{const row=document.createElement('div');row.className='location-row';const cb=document.createElement('input');cb.type='checkbox';cb.checked=favorites.includes(value);cb.addEventListener('change',()=>{if(cb.checked&&!favorites.includes(value))favorites.push(value);if(!cb.checked)favorites=favorites.filter(x=>x!==value);save();renderFavorites();});const label=document.createElement('label');label.textContent=value;const del=document.createElement('button');del.className='danger';del.textContent='Supprimer';del.addEventListener('click',()=>{locations=locations.filter(x=>x!==value);favorites=favorites.filter(x=>x!==value);save();renderSettings();renderFavorites();});row.append(cb,label,del);locationList.appendChild(row);});}
function showPage(index){currentPage=(index+pages.length)%pages.length;pages.forEach((p,i)=>p.classList.toggle('active',i===currentPage));navButtons.forEach((b,i)=>b.classList.toggle('active',i===currentPage));if(currentPage===3)renderSettings();}
navButtons.forEach((b,i)=>b.addEventListener('click',()=>showPage(i)));searchInput.addEventListener('input',renderSearch);generateButton.addEventListener('click',()=>{const v=searchInput.value.trim().toUpperCase();if(v)openBarcode(v);});addLocationButton.addEventListener('click',()=>{const v=newLocationInput.value.trim().toUpperCase();if(v&&!locations.includes(v)){locations.push(v);save();newLocationInput.value='';renderSettings();}});settingsFilter.addEventListener('input',renderSettings);resetButton.addEventListener('click',()=>{locations=defaultLocations();favorites=[...DEFAULT_FAVORITES];save();renderSettings();renderFavorites();});
closeButton.addEventListener('click',closeViewer);closeButton.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();});viewer.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();});viewer.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;touchY=e.changedTouches[0].screenY},{passive:true});viewer.addEventListener('touchend',e=>{if(currentQr<0)return;const dx=e.changedTouches[0].screenX-touchX,dy=e.changedTouches[0].screenY-touchY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){e.preventDefault();e.stopPropagation();openQr(currentQr+(dx<0?1:-1));}},{passive:false});
let pageTouchX=0,pageTouchY=0;appMain.addEventListener('touchstart',e=>{pageTouchX=e.changedTouches[0].screenX;pageTouchY=e.changedTouches[0].screenY},{passive:true});appMain.addEventListener('touchend',e=>{if(viewer.classList.contains('active')||currentPage===3)return;const dx=e.changedTouches[0].screenX-pageTouchX,dy=e.changedTouches[0].screenY-pageTouchY;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.3)showPage(currentPage+(dx<0?1:-1));},{passive:true});
renderFavorites();renderQrButtons();renderSearch();
})();
</script>
</body></html>
