<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#2f9e16"><title>Codes entrepôt</title><link rel="icon" href="LOGO%20code%20barre.png"><link rel="apple-touch-icon" href="LOGO%20code%20barre.png"><style>
:root{--g:#2f9e16;--bg:#f6f8f5;--nav:76px}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111}button,input{font:inherit}.main{height:calc(100dvh - var(--nav) - env(safe-area-inset-bottom));max-width:760px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 12px 10px;overflow:hidden;touch-action:pan-x}.page{display:none;height:100%;overflow:hidden}.page.on{display:block}.page.right{animation:right .18s ease}.page.left{animation:left .18s ease}@keyframes right{from{opacity:.35;transform:translateX(32px)}}@keyframes left{from{opacity:.35;transform:translateX(-32px)}}.favgrid,.qrgrid{height:100%;display:grid;gap:12px 10px}.favgrid{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(7,1fr)}.fav,.qrbtn{border:2px solid var(--g);border-radius:14px;background:linear-gradient(145deg,#fff,#f3ffef);color:#111;font-weight:800;box-shadow:0 3px 8px #2f9e1620;min-height:0}.fav{font-size:20px}.fav:active,.qrbtn:active{transform:scale(.96);background:#e8f7e3}.qrgrid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(7,1fr)}.qrbtn{position:relative;font-size:18px;padding:8px 8px 8px 48px;text-align:left;overflow:hidden}.qrbtn:before{content:"";position:absolute;left:12px;top:50%;width:25px;height:25px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,#111 0 3px,transparent 3px 6px);border:2px solid #111;border-radius:3px}.searchpage{position:relative;height:100%;padding-bottom:75px}.results{height:100%;display:grid;gap:8px;overflow:auto;padding-bottom:8px}.result{border:0;border-radius:12px;background:#fff;padding:14px;text-align:left;font-size:17px;font-weight:800;box-shadow:0 2px 8px #0001}.searchbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;background:var(--bg);padding-top:8px}.searchbar input,.field{width:100%;border:2px solid #bfcbbb;border-radius:12px;padding:14px;font-size:17px;text-transform:uppercase;background:#fff}.go{border:0;border-radius:12px;background:var(--g);color:#fff;padding:0 15px;font-weight:800}.settings{height:100%;overflow:auto;touch-action:pan-y}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px}.row{display:flex;gap:8px}.list{margin-top:12px}.item{display:flex;align-items:center;gap:10px;border-top:1px solid #ddd;padding:10px 2px}.item label{flex:1;font-weight:700}.del{border:0;border-radius:8px;padding:7px;color:#a00;background:#fee2e2}.empty{text-align:center;color:#687568;padding:24px}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:calc(var(--nav) + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #d4d4d4;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:#fff;padding:8px 2px 5px;color:#111;font-size:12px;font-weight:700}.nav button.on{color:var(--g);background:#eaf7e5}.ico{display:block;width:25px;height:25px;margin:0 auto 4px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.viewer{display:none;position:fixed;inset:0;z-index:20;background:#fff;align-items:center;justify-content:center;padding:16px;overflow:hidden;touch-action:none}.viewer.on{display:flex}.inside{text-align:center;width:100%}.vtitle{font-size:clamp(32px,10vw,72px);font-weight:900;margin-bottom:18px}.bar svg{display:block;width:100%;max-height:58vh}.bar img{width:min(88vw,600px);max-height:68vh;object-fit:contain;image-rendering:pixelated}.close{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));width:42px;height:42px;border:0;border-radius:50%;font-size:24px}.notice{font-size:22px;font-weight:800;line-height:1.4;padding:28px;color:#333}@media(max-height:700px){.favgrid,.qrgrid{gap:8px}.fav{font-size:18px}.qrbtn{font-size:16px}}
</style></head><body><main id="main" class="main"><section id="favorites" class="page on"><div id="favGrid" class="favgrid"></div></section><section id="generator" class="page"><div class="searchpage"><div id="results" class="results"></div><div class="searchbar"><input id="query" placeholder="Rechercher ou créer"><button class="go" id="make">Générer</button></div></div></section><section id="qrs" class="page"><div id="qrGrid" class="qrgrid"></div></section><section id="settings" class="page"><div class="settings"><div class="card"><b>Ajouter une localisation</b><div class="row" style="margin-top:10px"><input id="newLoc" class="field"><button id="add" class="go">Ajouter</button></div></div><div class="card"><b>Localisations et favoris</b><p>Coche les emplacements à afficher sur l’accueil.</p><input id="filter" class="field" placeholder="Filtrer"><div id="locList" class="list"></div><button id="reset" class="del" style="margin-top:12px">Réinitialiser</button></div></div></section></main><nav class="nav">
<button class="on" data-page="favorites"><svg class="ico" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9Z"/></svg>Favoris</button>
<button data-page="generator"><svg class="ico" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>Recherche</button>
<button data-page="qrs"><svg class="ico" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM15 14h2v2h-2zM19 14h1v3h-3v3h-3v-2M19 19h1v1h-1z"/></svg>QR codes</button>
<button data-page="settings"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Paramètres</button></nav><div id="viewer" class="viewer"><button class="close">×</button><div class="inside"><div id="vtitle" class="vtitle"></div><div id="bar" class="bar"></div></div></div>
<script>
const PAGES=['favorites','generator','qrs','settings'],DEF=['RC-0','F1','CONG 1','RC-1','F2','CONG 2','RC-2','F3','CONG 3','RB-0','F4','C3-A','RB-1','F5','VANCON','RB-2','AF4','AF5','G3','ART','DOCK-R'];const QR=[];for(let i=1;i<=7;i++){QR.push({n:'CARISTE '+i,s:'CARISTE'+i+'.png',ok:i<=5});QR.push({n:'PARTAGE '+i,s:(i===2||i===4?'PARATGE'+i:'PARTAGE'+i)+'.png',ok:i<=5})}
const p=n=>String(n).padStart(2,'0');function defaults(){let a=['A','AF4','AF5','ART','C3-A','CONG 1','CONG 2','CONG 3','RC-0','RC-1','RC-2','RB-0','RB-1','RB-2','G3'];for(let n=1;n<=55;n++)if(n!==38)a.push('D'+p(n));a.push('DOCK-D','DOCK-R','F1','F2','F3','F4','F5');for(let n=1;n<=12;n++)a.push('P'+p(n));a.push('PN');for(const z of ['RA','RB','RC'])for(let r=1;r<=22;r++)for(const c of ['A','B','C','D'])for(let l=1;l<=2;l++)a.push(z+p(r)+c+l);for(let r=4;r<=22;r+=2)for(const c of ['A','B','C','D'])for(let l=1;l<=2;l++)a.push('RD'+p(r)+c+l);a.push('SALLE-DE-TRIE');for(let n=1;n<=10;n++)a.push('VAN'+n);a.push('VANCON');return [...new Set(a)]}function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}let loc=load('warehouse_locations_v5',defaults()),fav=load('warehouse_favorites_v5',DEF).filter(x=>loc.includes(x)),page=0;function save(){localStorage.setItem('warehouse_locations_v5',JSON.stringify(loc));localStorage.setItem('warehouse_favorites_v5',JSON.stringify(fav))}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const C=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];function svg(t){t=t.toUpperCase();let v=[...t].map(c=>Math.max(0,Math.min(94,c.charCodeAt(0)-32))),sum=104;v.forEach((n,i)=>sum+=n*(i+1));let x=10,b='';for(const code of [104,...v,sum%103,106])for(let i=0;i<C[code].length;i++){let w=+C[code][i]*2;if(i%2===0)b+=`<rect x="${x}" width="${w}" height="120"/>`;x+=w}return `<svg viewBox="0 0 ${x+10} 120"><rect width="100%" height="100%" fill="white"/>${b}</svg>`}
const V=document.getElementById('viewer');let qi=-1;function openBar(t){qi=-1;vtitle.textContent=t;bar.innerHTML=svg(t);V.classList.add('on')}function openQR(i){qi=(i+QR.length)%QR.length;let q=QR[qi];vtitle.textContent=q.n;bar.innerHTML=q.ok?`<img src="${q.s}" alt="${q.n}">`:'<div class="notice">Veuillez téléverser l’image dans GitHub.</div>';V.classList.add('on')}function closeV(){V.classList.remove('on')}function renderFav(){favGrid.innerHTML=fav.map(x=>`<button class="fav" data-x="${esc(x)}">${esc(x)}</button>`).join('');favGrid.querySelectorAll('button').forEach(b=>b.onclick=()=>openBar(b.dataset.x))}function search(){let q=query.value.trim().toUpperCase();results.innerHTML=q?loc.filter(x=>x.includes(q)).slice(0,60).map(x=>`<button class="result" data-x="${esc(x)}">${esc(x)}</button>`).join(''):'<div class="empty">Commence à écrire une localisation.</div>';results.querySelectorAll('button').forEach(b=>b.onclick=()=>openBar(b.dataset.x))}function renderQR(){let left=QR.filter(x=>x.n.startsWith('CARISTE')),right=QR.filter(x=>x.n.startsWith('PARTAGE'));let ordered=[];for(let i=0;i<7;i++)ordered.push(left[i],right[i]);qrGrid.innerHTML=ordered.map(q=>`<button class="qrbtn" data-i="${QR.indexOf(q)}">${q.n}</button>`).join('');qrGrid.querySelectorAll('button').forEach(b=>b.onclick=()=>openQR(+b.dataset.i))}function renderSet(){let q=filter.value.trim().toUpperCase();locList.innerHTML=loc.filter(x=>x.includes(q)).map(x=>`<div class="item"><input type="checkbox" data-f="${esc(x)}" ${fav.includes(x)?'checked':''}><label>${esc(x)}</label><button class="del" data-d="${esc(x)}">Supprimer</button></div>`).join('');document.querySelectorAll('[data-f]').forEach(c=>c.onchange=()=>{let x=c.dataset.f;c.checked&&!fav.includes(x)?fav.push(x):fav=fav.filter(v=>v!==x);save();renderFav()});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let x=b.dataset.d;if(confirm('Supprimer '+x+' ?')){loc=loc.filter(v=>v!==x);fav=fav.filter(v=>v!==x);save();renderSet();renderFav()}})}function go(i,dir=0){page=(i+4)%4;document.querySelectorAll('.page').forEach(x=>x.className='page');let el=document.getElementById(PAGES[page]);el.classList.add('on');if(dir)el.classList.add(dir>0?'right':'left');document.querySelectorAll('.nav button').forEach((b,j)=>b.classList.toggle('on',j===page));if(page===3)renderSet()}
document.querySelectorAll('.nav button').forEach((b,i)=>b.onclick=()=>go(i,i>page?1:-1));query.oninput=search;make.onclick=()=>{let x=query.value.trim().toUpperCase();if(x)openBar(x)};filter.oninput=renderSet;add.onclick=()=>{let x=newLoc.value.trim().toUpperCase();if(x&&!loc.includes(x)){loc.push(x);save();newLoc.value='';renderSet()}};reset.onclick=()=>{if(confirm('Réinitialiser la liste ?')){loc=defaults();fav=[...DEF];save();renderSet();renderFav()}};document.querySelector('.close').onclick=closeV;bar.onclick=e=>{e.stopPropagation();closeV()};let x0=0,y0=0;function st(e){x0=e.changedTouches[0].screenX;y0=e.changedTouches[0].screenY}function dl(e){return[e.changedTouches[0].screenX-x0,e.changedTouches[0].screenY-y0]}V.addEventListener('touchstart',st,{passive:true});V.addEventListener('touchend',e=>{let[dx,dy]=dl(e);if(qi>=0&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){e.preventDefault?.();openQR(qi+(dx<0?1:-1))}else if(Math.abs(dx)<25&&Math.abs(dy)<25)closeV()},{passive:false});main.addEventListener('touchstart',st,{passive:true});main.addEventListener('touchend',e=>{if(V.classList.contains('on')||page===3)return;let[dx,dy]=dl(e);if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.25)go(page+(dx<0?1:-1),dx<0?1:-1)},{passive:true});renderFav();search();renderQR();
</script></body></html>
