<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#2f9e16"><title>Codes entrepôt</title><link rel="icon" href="LOGO%20code%20barre.png"><link rel="apple-touch-icon" href="LOGO%20code%20barre.png"><style>
:root{--g:#2f9e16;--bg:#f5f7f4;--nav:76px}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111}button,input{font:inherit}.main{height:calc(100dvh - var(--nav) - env(safe-area-inset-bottom));max-width:760px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 10px 10px;overflow:hidden}.page{display:none;height:100%;overflow:hidden}.page.active{display:block}.fav-grid{height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(8,1fr);gap:8px}.fav{border:2px solid var(--g);border-radius:13px;background:#fff;font-size:19px;font-weight:900;box-shadow:0 2px 7px #0001}.orange{background:#ffe1b8}.rack{background:#f59e0b}.fresh{background:#cceeff}.cold{background:#a9c4e8}.yellow{background:#fff1a8}.gray{background:#dedede}.dock{background:#ff3b30;color:#111}.qr-grid{height:100%;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(7,1fr);gap:10px}.qr-btn{border:3px solid #111;border-radius:10px;background:#fff;color:var(--g);font-size:18px;font-weight:900}.search-wrap{height:100%;position:relative;padding-bottom:72px}.results{height:100%;overflow:auto;display:grid;align-content:start;gap:8px}.result{border:0;border-radius:12px;background:#fff;padding:14px;text-align:left;font-weight:800}.searchbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;background:var(--bg);padding-top:8px}.field{width:100%;border:2px solid #bcc9b7;border-radius:12px;padding:14px;font-size:17px;text-transform:uppercase;background:#fff}.primary{border:0;border-radius:12px;background:var(--g);color:#fff;padding:0 15px;font-weight:800}.settings{height:100%;overflow:auto}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px}.row{display:flex;gap:8px;margin-top:10px}.loc-row{display:flex;gap:10px;align-items:center;border-top:1px solid #ddd;padding:9px 2px}.loc-row label{flex:1;font-weight:700}.danger{border:0;border-radius:8px;background:#fee2e2;color:#a00;padding:7px}.empty{text-align:center;color:#687568;padding:24px}.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #ccc;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:#fff;color:#111;font-size:12px;font-weight:700}.nav button.active{color:var(--g);background:#eaf7e5}.ico{display:block;width:25px;height:25px;margin:0 auto 4px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.overlay{display:none;position:fixed;inset:0;z-index:1000;background:#fff;padding:max(18px,env(safe-area-inset-top)) 14px calc(var(--nav) + 18px);overflow:hidden}.overlay.active{display:block}.barcode-view{height:100%;display:flex;align-items:center;justify-content:center;text-align:center}.barcode-title{font-size:clamp(34px,11vw,72px);font-weight:900;margin-bottom:20px}.barcode-body svg{width:100%;max-height:58vh}.barcode-body img{width:min(88vw,600px);max-height:65vh;object-fit:contain;image-rendering:pixelated}.round{position:absolute;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px);width:60px;height:60px;border:0;border-radius:50%;background:#111;color:#fff;font-size:32px;font-weight:900;box-shadow:0 4px 14px #0004}.close{right:18px}.back{right:90px}.builder{height:100%;display:flex;flex-direction:column}.build-head{text-align:center}.build-title{font-size:23px;font-weight:900;margin:0 0 4px}.build-code{font-size:28px;color:var(--g);font-weight:900;min-height:35px}.choices{flex:1;display:grid;align-content:center;gap:12px}.choice{border:3px solid #111;border-radius:12px;background:#fff;color:#111;font-weight:900;font-size:20px;min-height:58px}.aisles{grid-template-columns:repeat(4,1fr)}.numbers{grid-template-columns:1fr 1fr;align-content:stretch}.num-col{display:grid;grid-template-rows:auto repeat(11,1fr);gap:4px;min-height:0}.num-title{text-align:center;font-size:17px;font-weight:900}.num{border:2px solid #111;border-radius:8px;background:#fff;font-size:17px;font-weight:900;min-height:0}.levels{grid-template-columns:1fr;grid-template-rows:repeat(4,1fr)}.positions{grid-template-columns:1fr 1fr}.notice{font-size:22px;font-weight:800;padding:28px}@media(max-height:700px){.fav-grid{gap:5px}.fav{font-size:17px}.qr-grid{gap:6px}.choice{min-height:48px}.num{font-size:15px}}
</style></head><body><main class="main"><section id="p0" class="page active"><div id="favGrid" class="fav-grid"></div></section><section id="p1" class="page"><div class="search-wrap"><div id="results" class="results"></div><div class="searchbar"><input id="search" class="field" placeholder="Rechercher ou créer"><button id="generate" class="primary">Générer</button></div></div></section><section id="p2" class="page"><div id="qrGrid" class="qr-grid"></div></section><section id="p3" class="page"><div class="settings"><div class="card"><b>Ajouter une localisation</b><div class="row"><input id="newLoc" class="field"><button id="addLoc" class="primary">Ajouter</button></div></div><div class="card"><b>Localisations et favoris</b><input id="filter" class="field" placeholder="Filtrer"><div id="locList"></div><button id="reset" class="danger">Réinitialiser</button></div></div></section></main>
<nav class="nav"><button class="active" data-i="0"><svg class="ico" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9Z"/></svg>Favoris</button><button data-i="1"><svg class="ico" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>Recherche</button><button data-i="2"><svg class="ico" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM15 14h2v2h-2zM19 14h1v3h-3v3h-3v-2M19 19h1v1h-1z"/></svg>QR codes</button><button data-i="3"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3 13 5.4 15.6 6 17.7 4.8 19.2 6.3 18 8.4 18.6 11 21 12 18.6 13 18 15.6 19.2 17.7 17.7 19.2 15.6 18 13 18.6 12 21 11 18.6 8.4 18 6.3 19.2 4.8 17.7 6 15.6 5.4 13 3 12 5.4 11 6 8.4 4.8 6.3 6.3 4.8 8.4 6 11 5.4Z"/><circle cx="12" cy="12" r="3"/></svg>Paramètres</button></nav>
<div id="viewer" class="overlay"><div class="barcode-view"><div><div id="vTitle" class="barcode-title"></div><div id="vBody" class="barcode-body"></div></div></div><button id="vClose" class="round close">×</button></div>
<div id="rack" class="overlay"><div class="builder"><div class="build-head"><div id="stepTitle" class="build-title"></div><div id="buildCode" class="build-code"></div></div><div id="choices" class="choices"></div></div><button id="rackBack" class="round back">◀</button><button id="rackClose" class="round close">×</button></div>
<script>(function(){'use strict';const $=id=>document.getElementById(id);const F=[['RC-1','orange'],['RC-0','orange'],['RC-2','orange'],['RB-1','orange'],['RB-0','orange'],['RB-2','orange'],['RD-2','orange'],['RACK','rack'],['RA-1','orange'],['F1','fresh'],['CONG 1','cold'],['AF4','yellow'],['F2','fresh'],['CONG 2','cold'],['AF5','yellow'],['F3','fresh'],['CONG 3','cold'],['G3','gray'],['F4','fresh'],['C3-A','cold'],['ART','gray'],['F5','fresh'],['VANCON','cold'],['DOCK-R','dock']];const DEFAULT=F.filter(x=>x[0]!=='RACK').map(x=>x[0]);const QR=[];for(let i=1;i<=7;i++){QR.push({n:'CARISTE '+i,f:'CARISTE'+i+'.png',ok:i<=5});QR.push({n:'PARTAGE '+i,f:(i===2||i===4?'PARATGE'+i:'PARTAGE'+i)+'.png',ok:i<=5})}const pad=n=>String(n).padStart(2,'0');function allLoc(){let a=[...DEFAULT,'A','PN','DOCK-D','SALLE-DE-TRIE'];for(let n=1;n<=55;n++)if(n!==38)a.push('D'+pad(n));for(let n=1;n<=12;n++)a.push('P'+pad(n));for(const z of ['RA','RB','RC'])for(let r=1;r<=22;r++)for(const c of ['A','B','C','D'])for(let l=1;l<=2;l++)a.push(z+pad(r)+c+l);for(let r=4;r<=22;r+=2)for(const c of ['A','B','C','D'])for(let l=1;l<=2;l++)a.push('RD'+pad(r)+c+l);for(let n=1;n<=10;n++)a.push('VAN'+n);return[...new Set(a)]}function load(k,d){try{let v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:d}catch{return d}}let loc=load('loc_v6',allLoc()),fav=load('fav_v6',DEFAULT),page=0,closing=false;function save(){localStorage.setItem('loc_v6',JSON.stringify(loc));localStorage.setItem('fav_v6',JSON.stringify(fav))}
const P=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];function svg(t){let v=[...t.toUpperCase()].map(c=>Math.max(0,Math.min(94,c.charCodeAt(0)-32))),sum=104;v.forEach((n,i)=>sum+=n*(i+1));let x=10,b='';for(const code of[104,...v,sum%103,106])for(let i=0;i<P[code].length;i++){let w=+P[code][i]*2;if(i%2===0)b+=`<rect x="${x}" width="${w}" height="120"/>`;x+=w}return`<svg viewBox="0 0 ${x+10} 120"><rect width="100%" height="100%" fill="white"/>${b}</svg>`}function openBar(v){if(closing)return;$('vTitle').textContent=v;$('vBody').innerHTML=svg(v);$('viewer').classList.add('active')}function closeOverlay(id,e){if(e){e.preventDefault();e.stopPropagation()}if(closing)return;closing=true;$(id).classList.remove('active');setTimeout(()=>closing=false,400)}function renderFav(){$('favGrid').innerHTML='';F.forEach(([n,c])=>{let b=document.createElement('button');b.className='fav '+c;b.textContent=n;b.onclick=()=>n==='RACK'?startRack():openBar(n);$('favGrid').appendChild(b)})}function renderQR(){$('qrGrid').innerHTML='';QR.forEach((q,i)=>{let b=document.createElement('button');b.className='qr-btn';b.textContent=q.n;b.onclick=()=>{if(closing)return;$('vTitle').textContent=q.n;$('vBody').innerHTML=q.ok?`<img src="${q.f}">`:'<div class="notice">Veuillez téléverser l’image dans GitHub.</div>';$('viewer').classList.add('active')};$('qrGrid').appendChild(b)})}function search(){let q=$('search').value.trim().toUpperCase(),a=q?loc.filter(x=>x.includes(q)).slice(0,60):[];$('results').innerHTML='';if(!a.length){$('results').innerHTML='<div class="empty">Commence à écrire une localisation.</div>';return}a.forEach(v=>{let b=document.createElement('button');b.className='result';b.textContent=v;b.onclick=()=>openBar(v);$('results').appendChild(b)})}function renderSettings(){let q=$('filter').value.trim().toUpperCase();$('locList').innerHTML='';loc.filter(x=>x.includes(q)).forEach(v=>{let r=document.createElement('div');r.className='loc-row';let c=document.createElement('input');c.type='checkbox';c.checked=fav.includes(v);c.onchange=()=>{c.checked&&!fav.includes(v)?fav.push(v):fav=fav.filter(x=>x!==v);save()};let l=document.createElement('label');l.textContent=v;let d=document.createElement('button');d.className='danger';d.textContent='Supprimer';d.onclick=()=>{loc=loc.filter(x=>x!==v);fav=fav.filter(x=>x!==v);save();renderSettings()};r.append(c,l,d);$('locList').appendChild(r)})}function showPage(i){page=(i+4)%4;document.querySelectorAll('.page').forEach((p,j)=>p.classList.toggle('active',i===j));document.querySelectorAll('.nav button').forEach((b,j)=>b.classList.toggle('active',i===j));if(i===3)renderSettings()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(+b.dataset.i));$('search').oninput=search;$('generate').onclick=()=>{let v=$('search').value.trim().toUpperCase();if(v)openBar(v)};$('filter').oninput=renderSettings;$('addLoc').onclick=()=>{let v=$('newLoc').value.trim().toUpperCase();if(v&&!loc.includes(v)){loc.push(v);save();$('newLoc').value='';renderSettings()}};$('reset').onclick=()=>{loc=allLoc();fav=[...DEFAULT];save();renderSettings()};$('vClose').onclick=e=>closeOverlay('viewer',e);
let step=0,picks=['','','',''];function startRack(){step=0;picks=['','','',''];$('rack').classList.add('active');renderRack()}function code(){return picks.join('')}function btn(text,val){let b=document.createElement('button');b.className='choice';b.textContent=text;b.onclick=()=>{picks[step]=val;step++;if(step===4){$('rack').classList.remove('active');openBar(code())}else renderRack()};return b}function renderRack(){let box=$('choices');box.innerHTML='';box.className='choices';$('buildCode').textContent=code();$('rackBack').style.visibility=step===0?'hidden':'visible';if(step===0){$('stepTitle').textContent='Choisis l’allée';box.classList.add('aisles');[['D','RD'],['C','RC'],['B','RB'],['A','RA']].forEach(x=>box.appendChild(btn(x[0],x[1])))}else if(step===1){$('stepTitle').textContent='Choisis le numéro';box.classList.add('numbers');let odd=document.createElement('div'),even=document.createElement('div');odd.className=even.className='num-col';odd.innerHTML='<div class="num-title">IMPAIR</div>';even.innerHTML='<div class="num-title">PAIR</div>';for(let n=21;n>=1;n-=2){let b=document.createElement('button');b.className='num';b.textContent=n;b.onclick=()=>{picks[1]=pad(n);step=2;renderRack()};odd.appendChild(b)}for(let n=22;n>=2;n-=2){let b=document.createElement('button');b.className='num';b.textContent=n;b.onclick=()=>{picks[1]=pad(n);step=2;renderRack()};even.appendChild(b)}box.append(odd,even)}else if(step===2){$('stepTitle').textContent='Choisis le niveau';box.classList.add('levels');[['3e étage (D)','D'],['2e étage (C)','C'],['1er étage (B)','B'],['Sol (A)','A']].forEach(x=>box.appendChild(btn(x[0],x[1])))}else{$('stepTitle').textContent='Choisis la position';box.classList.add('positions');[['Droite (1)','1'],['Gauche (2)','2']].forEach(x=>box.appendChild(btn(x[0],x[1])))} }$('rackBack').onclick=e=>{e.preventDefault();e.stopPropagation();if(step>0){step--;picks[step]='';renderRack()}};$('rackClose').onclick=e=>closeOverlay('rack',e);renderFav();renderQR();search();})();</script></body></html>
